[project]
name = "secure-agentic-sandbox"
version = "0.1.0"
description = "A secure sandbox prototype for isolated Python execution using OpenSandbox and gVisor."
readme = "README.md"
authors = [
    { name = "Samhitha1212", email = "cs23btech11018@iith.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "opensandbox>=1.1.1",
]

[project.scripts]
secure-agentic-sandbox = "secure_agentic_sandbox.runner:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]